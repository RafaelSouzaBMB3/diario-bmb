<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5e49">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Diário BMB3">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icone-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icone-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<title>Diário de Obra BMB3</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f5;font-family:Arial,Helvetica,sans-serif}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top);background:#f4f6f5}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}
#install{display:none;position:fixed;z-index:20;left:16px;right:16px;bottom:16px;padding:14px 16px;border:0;border-radius:12px;background:#1f5e49;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app">
<iframe src="https://script.google.com/macros/s/AKfycbzruKBl21b8B2U6nQk1sqWhv-a4mQeP1ZILEysc6_9DNYAflQs7gtkeJ7R6p17SU5_N/exec" title="Diário de Obra BMB3" allow="camera; microphone"></iframe>
</div>
<button id="install">INSTALAR DIÁRIO DE OBRA BMB3</button>
<script>
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;document.getElementById("install").style.display="block";});
document.getElementById("install").addEventListener("click",async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("install").style.display="none";});
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
